<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" width="960" height="635" viewBox="0 0 960 635">
  <title id="title">XSum evaluation results</title>
  <desc id="desc">Agentic loops · Faithfulness. Each loop beat the single-agent baseline on 2 of 3 backbones. Agentic loops · Reliability. 52–55% of articles passed on all three seeds. Agentic loops · Cost per summary. 3.0–4.1 model calls and 4.35–12.52 seconds per summary. Agentic loops · Evaluation runs completed. 39 of 39 evaluation attempts completed. RL-trained agent · Faithfulness. Beat the single-agent baseline on all 3 backbones. RL-trained agent · Reliability. 57% of articles passed on all three seeds. RL-trained agent · Cost per summary. 1 model call and 1.14 seconds per summary. 33–58 GPU-hours of training per backbone. RL-trained agent · Evaluation runs completed. 9 of 16 evaluation attempts completed.</desc>
  <metadata>Archify tree. Source revision 0a814df9f668bd6fb22c9f7e081e5e2adeae544e. Layout adapted for GitHub README images.</metadata>
  <rect x="0" y="0" width="100%" height="100%" rx="0" fill="#000000" stroke="none" />
  <g id="xsum">
    <rect x="378" y="14" width="204" height="40" rx="9" fill="#181818" stroke="#707070" />
    <text x="480" y="41" fill="#ffffff" font-size="21" text-anchor="middle" font-weight="bold">XSum evaluation</text>
  </g>
  <g id="loops">
    <path d="M 480 54 V 67 H 242.0 V 80" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="xsum" data-to="loops" />
    <rect x="19" y="80" width="446" height="70" rx="10" fill="#191919" stroke="#686868" />
    <text x="242.0" y="110" fill="#ffffff" font-size="23" text-anchor="middle" font-weight="bold">Agentic loops</text>
    <text x="242.0" y="135" fill="#d0d0d0" font-size="17" text-anchor="middle">Self-Refine and Critique-Revise</text>
  </g>
  <g id="loops_faith">
    <path d="M 33 150 V 188 H 51" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="loops" data-to="loops_faith" />
    <rect x="51" y="165" width="414" height="99" rx="8" fill="#0b0b0b" stroke="#4a4a4a" />
    <text x="67" y="189" fill="#cacaca" font-size="16" text-anchor="start">Faithfulness</text>
    <text x="67" y="221" fill="#ffffff" font-size="25" text-anchor="start" font-weight="bold">2 of 3 backbones</text>
    <text x="67" y="246" fill="#d8d8d8" font-size="16" text-anchor="start">Each loop beat the single-agent baseline.</text>
  </g>
  <g id="loops_reliable">
    <path d="M 33 188 V 298 H 51" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="loops" data-to="loops_reliable" />
    <rect x="51" y="275" width="414" height="99" rx="8" fill="#0b0b0b" stroke="#4a4a4a" />
    <text x="67" y="299" fill="#cacaca" font-size="16" text-anchor="start">Reliability</text>
    <text x="67" y="331" fill="#ffffff" font-size="25" text-anchor="start" font-weight="bold">52–55%</text>
    <text x="67" y="356" fill="#d8d8d8" font-size="16" text-anchor="start">Articles that passed on all three seeds.</text>
  </g>
  <g id="loops_cost">
    <path d="M 33 298 V 408 H 51" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="loops" data-to="loops_cost" />
    <rect x="51" y="385" width="414" height="125" rx="8" fill="#0b0b0b" stroke="#4a4a4a" />
    <text x="67" y="409" fill="#cacaca" font-size="16" text-anchor="start">Cost per summary</text>
    <text x="67" y="441" fill="#ffffff" font-size="25" text-anchor="start" font-weight="bold">3.0–4.1 calls</text>
    <text x="67" y="466" fill="#d8d8d8" font-size="16" text-anchor="start">4.35–12.52 seconds per summary.</text>
  </g>
  <g id="loops_complete">
    <path d="M 33 408 V 544 H 51" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="loops" data-to="loops_complete" />
    <rect x="51" y="521" width="414" height="99" rx="8" fill="#0b0b0b" stroke="#4a4a4a" />
    <text x="67" y="545" fill="#cacaca" font-size="16" text-anchor="start">Evaluation runs completed</text>
    <text x="67" y="577" fill="#ffffff" font-size="25" text-anchor="start" font-weight="bold">39 of 39</text>
    <text x="67" y="602" fill="#d8d8d8" font-size="16" text-anchor="start">Evaluation attempts that completed.</text>
  </g>
  <g id="rl">
    <path d="M 480 54 V 67 H 718.0 V 80" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="xsum" data-to="rl" />
    <rect x="495" y="80" width="446" height="70" rx="10" fill="#191919" stroke="#686868" />
    <text x="718.0" y="110" fill="#ffffff" font-size="23" text-anchor="middle" font-weight="bold">RL-trained agent</text>
    <text x="718.0" y="135" fill="#d0d0d0" font-size="17" text-anchor="middle">GRPO</text>
  </g>
  <g id="rl_faith">
    <path d="M 509 150 V 188 H 527" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="rl" data-to="rl_faith" />
    <rect x="527" y="165" width="414" height="99" rx="8" fill="#0b0b0b" stroke="#4a4a4a" />
    <text x="543" y="189" fill="#cacaca" font-size="16" text-anchor="start">Faithfulness</text>
    <text x="543" y="221" fill="#ffffff" font-size="25" text-anchor="start" font-weight="bold">3 of 3 backbones</text>
    <text x="543" y="246" fill="#d8d8d8" font-size="16" text-anchor="start">GRPO beat the single-agent baseline.</text>
  </g>
  <g id="rl_reliable">
    <path d="M 509 188 V 298 H 527" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="rl" data-to="rl_reliable" />
    <rect x="527" y="275" width="414" height="99" rx="8" fill="#0b0b0b" stroke="#4a4a4a" />
    <text x="543" y="299" fill="#cacaca" font-size="16" text-anchor="start">Reliability</text>
    <text x="543" y="331" fill="#ffffff" font-size="25" text-anchor="start" font-weight="bold">57%</text>
    <text x="543" y="356" fill="#d8d8d8" font-size="16" text-anchor="start">Articles that passed on all three seeds.</text>
  </g>
  <g id="rl_cost">
    <path d="M 509 298 V 408 H 527" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="rl" data-to="rl_cost" />
    <rect x="527" y="385" width="414" height="125" rx="8" fill="#0b0b0b" stroke="#4a4a4a" />
    <text x="543" y="409" fill="#cacaca" font-size="16" text-anchor="start">Cost per summary</text>
    <text x="543" y="441" fill="#ffffff" font-size="25" text-anchor="start" font-weight="bold">1 call</text>
    <text x="543" y="466" fill="#d8d8d8" font-size="16" text-anchor="start">1.14 seconds per summary.</text>
    <text x="543" y="487" fill="#d8d8d8" font-size="16" text-anchor="start">33–58 GPU-hours of training per backbone.</text>
  </g>
  <g id="rl_complete">
    <path d="M 509 408 V 544 H 527" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="rl" data-to="rl_complete" />
    <rect x="527" y="521" width="414" height="99" rx="8" fill="#0b0b0b" stroke="#4a4a4a" />
    <text x="543" y="545" fill="#cacaca" font-size="16" text-anchor="start">Evaluation runs completed</text>
    <text x="543" y="577" fill="#ffffff" font-size="25" text-anchor="start" font-weight="bold">9 of 16</text>
    <text x="543" y="602" fill="#d8d8d8" font-size="16" text-anchor="start">Evaluation attempts that completed.</text>
  </g>
</svg>
