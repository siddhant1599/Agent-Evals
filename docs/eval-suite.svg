<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" width="960" height="853" viewBox="0 0 960 853">
  <title id="title">The evaluation suite</title>
  <desc id="desc">Outcome. Is the answer faithful to its evidence? MiniCheck (headline), AlignScore, SummaC and FactCC score faithfulness. ROUGE-L and BERTScore measure summary quality. Grounding &amp; citation. Do the cited sources support the claims? On ASQA, ALCE citation recall and precision, plus exact-match answer recall. Reliability. How consistently does the agent succeed? pass@1, pass@k, pass^k, seed-to-seed standard deviation and run-completion rate. Trajectory. How did the agent produce the answer? Per-call traces, LLM calls and rounds per task, self-termination, completion-cap and blank-output rates. Efficiency. What did the answer cost? Tokens and seconds per task, plus GPU-hours spent training. Comparative. Did the added agent steps pay off? Paired gain over baseline with a 95% CI, token multiplier, gain per 1k extra tokens, Pareto frontier and break-even point. Ablation. Which component accounts for the gain? Compare T2 with T2-noTool to isolate the contribution of the critic’s tool. Integrity. Can we trust the evaluation? Validate judges against human labels, check judge agreement and worked-example leaks, and test for reward exploitation on held-out data (in progress).</desc>
  <metadata>Archify tree. Source revision 0a814df9f668bd6fb22c9f7e081e5e2adeae544e. Layout adapted for GitHub README images.</metadata>
  <rect x="0" y="0" width="100%" height="100%" rx="0" fill="#000000" stroke="none" />
  <g id="suite">
    <rect x="16" y="12" width="190" height="44" rx="9" fill="#181818" stroke="#686868" />
    <text x="35" y="42" fill="#ffffff" font-size="22" text-anchor="start" font-weight="bold">Evaluation suite</text>
  </g>
  <g id="output">
    <path d="M 32 56 V 83 H 49" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="suite" data-to="output" />
    <text x="60" y="89" fill="#ffffff" font-size="20" text-anchor="start" font-weight="bold">Answer quality</text>
    <path d="M 219 83 H 274.5 V 107" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="output" data-to="outcome" />
    <path d="M 219 83 H 724.5 V 107" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="output" data-to="grounding" />
    <g id="outcome">
      <rect x="58" y="107" width="433" height="147" rx="9" fill="#0c0c0c" stroke="#4a4a4a" />
      <text x="74" y="137" fill="#ffffff" font-size="21" text-anchor="start" font-weight="bold">Outcome</text>
      <text x="74" y="163" fill="#eaeaea" font-size="17" text-anchor="start">Is the answer faithful to its evidence?</text>
      <text x="74" y="188" fill="#bdbdbd" font-size="16" text-anchor="start">MiniCheck (headline), AlignScore, SummaC and</text>
      <text x="74" y="208" fill="#bdbdbd" font-size="16" text-anchor="start">FactCC score faithfulness. ROUGE-L and BERTScore</text>
      <text x="74" y="228" fill="#bdbdbd" font-size="16" text-anchor="start">measure summary quality.</text>
    </g>
    <g id="grounding">
      <rect x="508" y="107" width="433" height="147" rx="9" fill="#0c0c0c" stroke="#4a4a4a" />
      <text x="524" y="137" fill="#ffffff" font-size="21" text-anchor="start" font-weight="bold">Grounding &amp; citation</text>
      <text x="524" y="163" fill="#eaeaea" font-size="17" text-anchor="start">Do the cited sources support the claims?</text>
      <text x="524" y="188" fill="#bdbdbd" font-size="16" text-anchor="start">On ASQA, ALCE citation recall and precision, plus</text>
      <text x="524" y="208" fill="#bdbdbd" font-size="16" text-anchor="start">exact-match answer recall.</text>
    </g>
  </g>
  <g id="execution">
    <path d="M 32 83 V 283 H 49" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="suite" data-to="execution" />
    <text x="60" y="289" fill="#ffffff" font-size="20" text-anchor="start" font-weight="bold">Run behavior</text>
    <path d="M 203 283 H 274.5 V 307" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="execution" data-to="reliability" />
    <path d="M 203 283 H 724.5 V 307" fill="none" stroke="#727272" stroke-width="1.4" stroke-linejoin="round" data-from="execution" data-to="trajectory" />
    <g id="reliability">
