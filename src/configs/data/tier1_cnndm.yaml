# CNN/DailyMail evaluation policy: D-002, D-035, D-037. Owner remains required via an override.
# The frozen 500-ID sample lives in tier1_cnndm_sample.yaml and composes in below, so the
# parameters here stay readable. Never set data.sample_ids in this file -- a file's own keys
# beat its defaults, so a value here would silently override the frozen sample.
defaults: [../base, tier1_cnndm_sample]
name: tier1_cnndm

data:
  # Registered public dataset adapter, immutable upstream revision, and the non-anonymized config.
  name: tier1_cnndm
  hf_path: abisee/cnn_dailymail
  hf_revision: 96df5e686bee6baa90b8bee7c28b81fa3fa6223d
  hf_config: "3.0.0"
  split: test
  # Two test articles appear twice under different ids; the lowest id is kept.
  dedupe_sources: true
  # Per-dataset length quantiles; boundary ties enter the shorter bucket.
  n_samples: 500
  n_strata: 3
  stratify_by: whitespace_words
  # Independent of run.seed. Remainders are allocated from shortest to longest.
  sample_seed: 123
  # Inclusive bounds. Serving handles context truncation; this loader never truncates.
  min_source_words: 20
  max_source_words: null
