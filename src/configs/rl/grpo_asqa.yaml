# T5 GRPO training on ASQA (D-132 to D-139): one config for all three backbones.
#
#   python3 src/run_training.py --config src/configs/rl/grpo_asqa.yaml \
#       --backbone qwen2.5-7b-instruct --set run.owner=sameer
#
# The 4,349 training questions are frozen in grpo_asqa_pool.yaml, composed below, by
# `python -m agent_evals.rl.pool`. An interrupted run continues with
# `python3 src/run_training.py --resume results/<run_id>` (D-059).
defaults: [../data/tier2_asqa_train, grpo_asqa_pool]
name: grpo_asqa

data:
  # Every training question with Huang et al.'s passages, the four ALCE worked examples removed
  # (D-132): the whole split is the pool, in an order drawn with the project's seed (D-139).
  # Never set data.sample_ids here: this file's own keys would override the frozen pool.
  n_samples: 4349
  n_strata: 1
  sample_seed: 123

# Not a training cap: above the longest training prompt measured (3,689 tokens, D-136), so every
# question is kept; the freeze records each prompt's length under all three tokenizers.
pool:
  prompt_cap: 4096
  backbones: [llama-3.1-8b-instruct, mistral-7b-instruct-v0.3, qwen2.5-7b-instruct]

metrics:
  citation:
    # The citation reward terms are judged by AlignScore, keeping MiniCheck held out (D-135).
    judge: alignscore

# Huang et al. 2024's three terms (D-133), weighted equally (D-135).
reward:
  name: null
  terms: [str_em, citation_recall, citation_precision]
  weights: [1.0, 1.0, 1.0]

# Every setting not listed is the approved default in config/training.py (D-054).
training:
  # GDPO combines the terms (D-134); it divides by group standard deviations, which
  # scale_rewards: group states.
  multi_objective_aggregation: normalize_then_sum
  scale_rewards: group
  # The evaluation prompt, 2 of ALCE's 4 worked examples as chat turns (D-118, D-138), drawn
  # afresh for every question so training covers the pairs evaluation seeds draw (D-139).
  worked_examples_draw: per_question
  # G = 4, one question's group per forward pass (D-138).
  num_generations: 4
  per_device_train_batch_size: 4
  # 16 questions per optimizer step, 271 steps: one pass over 4,336 of the 4,349 questions, each
  # used once (D-139).
  gradient_accumulation_steps: 16
  max_steps: 271
  # A checkpoint every 50 steps (800 questions), plus the final one (D-139).
  save_steps: 50
